<!DOCTYPE html>
<html>

<head>

    <title>Result - Student Hub Portal</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0d47a1, #1565c0, #42a5f5);
            color: white;
        }

        /* Header */

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 50px;
            background: rgba(0, 0, 0, 0.20);
        }

        header h1 {
            font-size: 30px;
        }

        /* Navigation */

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 18px;
            transition: 0.3s;
        }

        nav a:hover {
            color: yellow;
        }

        /* Main Container */

        .container {
            width: 80%;
            max-width: 800px;
            margin: 70px auto;
            padding: 45px;

            background: rgba(255, 255, 255, 0.15);
            border-radius: 15px;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);

            text-align: center;
        }

        /* Heading */

        .container h2 {
            font-size: 42px;
            margin-bottom: 35px;
        }

        /* Buttons */

        button {
            padding: 15px 35px;
            margin: 10px;

            border: none;
            border-radius: 30px;

            background: white;
            color: #1565c0;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: yellow;
            color: #1565c0;
            transform: scale(1.05);
        }

        /* Footer */

        footer {
            text-align: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.20);
            margin-top: 50px;
        }

        /* Mobile */

        @media (max-width: 700px) {

            header {
                flex-direction: column;
                gap: 15px;
                padding: 20px;
            }

            header h1 {
                font-size: 24px;
            }

            nav {
                text-align: center;
            }

            nav a {
                font-size: 14px;
                margin-left: 8px;
            }

            .container {
                width: 92%;
                padding: 30px 20px;
                margin: 40px auto;
            }

            .container h2 {
                font-size: 32px;
            }

            button {
                width: 80%;
            }

        }

    </style>

</head>


<body>


    <!-- Header -->

    <header>

        <h1>Student Hub Portal</h1>

        <nav>

            <a href="index.html">Home</a>

            <a href="register.html">Register</a>

            <a href="login.html">Login</a>

            <a href="dashboard.html">Dashboard</a>

            <a href="profile.html">Profile</a>

            <a href="events.html">Events</a>

            <a href="attendance.html">Attendance</a>

            <a href="result.html">Results</a>

            <a href="faq.html">FAQ</a>

        </nav>

    </header>


    <!-- Result Section -->

    <div class="container">

        <h2>Semester Results</h2>

        <button>Semester 1</button>

        <button>Semester 2</button>

        <button>Semester 3</button>

    </div>


    <!-- Footer -->

    <footer>

        <p>© 2026 Student Hub Portal | All Rights Reserved</p>

    </footer>


</body>

</html>

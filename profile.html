
<!DOCTYPE html>
<html>

<head>

    <title>Profile - Student Hub Portal</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0d47a1, #1565c0, #42a5f5);
            color: white;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 50px;
            background: rgba(0, 0, 0, 0.20);
        }

        header h1 {
            font-size: 30px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 18px;
        }

        nav a:hover {
            color: yellow;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 50px auto;
            padding: 35px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        .container h2 {
            text-align: center;
            font-size: 42px;
            margin-bottom: 25px;
        }

        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        input,
        select,
        button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
        }

        input {
            flex: 1;
            min-width: 200px;
        }

        select {
            min-width: 170px;
        }

        button {
            background: white;
            color: #0d47a1;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: yellow;
        }

        #message {
            text-align: center;
            margin-bottom: 20px;
            font-size: 18px;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 750px;
        }

        th,
        td {
            padding: 14px;
            font-size: 16px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.25);
        }

        th {
            background: rgba(0, 0, 0, 0.3);
        }

        td:first-child {
            font-weight: bold;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 25px;
        }

        #pageNumber {
            font-size: 17px;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.20);
            margin-top: 50px;
        }

        @media (max-width: 700px) {

            header {
                flex-direction: column;
                gap: 15px;
                padding: 20px;
            }

            nav {
                text-align: center;
            }

            nav a {
                display: inline-block;
                font-size: 14px;
                margin: 5px;
            }

            .container {
                width: 94%;
                padding: 20px;
                margin: 35px auto;
            }

            .container h2 {
                font-size: 30px;
            }

            .controls {
                flex-direction: column;
            }

            input,
            select,
            button {
                width: 100%;
            }

        }

    </style>

</head>

<body>

    <header>

        <h1>Student Hub Portal</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="register.html">Register</a>
            <a href="login.html">Login</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="profile.html">Profile</a>
            <a href="events.html">Events</a>
            <a href="attendance.html">Attendance</a>
            <a href="result.html">Results</a>
            <a href="faq.html">FAQ</a>
        </nav>

    </header>

    <div class="container">

        <h2>Student Profiles</h2>

        <p id="message">Loading student profiles...</p>

        <div class="controls">

            <input
                type="text"
                id="searchInput"
                placeholder="Search by name, enrollment, or department"
            >

            <select id="departmentFilter">

                <option value="all">All Departments</option>
                <option value="CSE">CSE</option>
                <option value="IT">IT</option>
                <option value="ECE">ECE</option>

            </select>

            <select id="sortSelect">

                <option value="default">Sort By</option>
                <option value="nameAsc">Name A-Z</option>
                <option value="nameDesc">Name Z-A</option>
                <option value="semesterAsc">Semester Low-High</option>
                <option value="semesterDesc">Semester High-Low</option>

            </select>

            <button id="resetButton">Reset</button>

        </div>

        <div class="table-container">

            <table>

                <thead>

                    <tr>
                        <th>Name</th>
                        <th>Enrollment</th>
                        <th>Department</th>
                        <th>Semester</th>
                        <th>College</th>
                        <th>Email</th>
                    </tr>

                </thead>

                <tbody id="profileTable">

                </tbody>

            </table>

        </div>

        <div class="pagination">

            <button id="previousButton">Previous</button>

            <span id="pageNumber">Page 1</span>

            <button id="nextButton">Next</button>

        </div>

    </div>

    <footer>

        <p>© 2026 Student Hub Portal | All Rights Reserved</p>

    </footer>

    <script src="js/api.js"></script>
<script src="js/profile.js"></script>
<script src="app.js"></script>

</body>

</html>

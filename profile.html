<!DOCTYPE html>
<html>

<head>

    <title>Profile - Student Hub Portal</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0d47a1, #1565c0, #42a5f5);
            color: white;
        }

        /* Header */

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 50px;
            background: rgba(0, 0, 0, 0.20);
        }

        header h1 {
            font-size: 30px;
        }

        /* Navigation */

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 18px;
        }

        nav a:hover {
            color: yellow;
        }

        /* Main Container */

        .container {
            width: 80%;
            max-width: 800px;
            margin: 70px auto;
            padding: 40px;

            background: rgba(255, 255, 255, 0.15);
            border-radius: 15px;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        /* Heading */

        .container h2 {
            text-align: center;
            font-size: 42px;
            margin-bottom: 30px;
        }

        /* Profile Table */

        table {
            width: 100%;
            border-collapse: collapse;
        }

        td {
            padding: 18px;
            font-size: 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.25);
        }

        td:first-child {
            font-weight: bold;
            background: rgba(0, 0, 0, 0.15);
            width: 40%;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* Footer */

        footer {
            text-align: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.20);
            margin-top: 50px;
        }

        /* Mobile */

        @media (max-width: 700px) {

            header {
                flex-direction: column;
                gap: 15px;
                padding: 20px;
            }

            nav a {
                font-size: 14px;
                margin-left: 8px;
            }

            .container {
                width: 92%;
                padding: 25px;
                margin: 40px auto;
            }

            .container h2 {
                font-size: 32px;
            }

            td {
                padding: 12px;
                font-size: 15px;
            }

        }

    </style>

</head>


<body>

    <!-- Header -->

    <header>

            <a href="attendance.html">Attendance</a>

            <a href="result.html">Results</a>

            <a href="faq.html">FAQ</a>

        </nav>

    </header>


    <!-- Profile Section -->

    <div class="container">

        <h2>Student Profile</h2>

        <table>

            <tr>

            </tr>

            </tr>

    </div>


    <!-- Footer -->

    <footer>

</body>


<!DOCTYPE html>
<html>

<head>

    <title>StudentHub - Login</title>

<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    }

    body {
        min-height: 100vh;
        background: linear-gradient(
            135deg,
            #fffaf5,
            #f5efff,
            #fceef5,
            #eef7ff
        );
        color: #34313d;
    }

    /* HEADER */
    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 18px 50px;

        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);

        border-bottom: 1px solid rgba(120, 100, 140, 0.12);

        box-shadow: 0 4px 20px rgba(70, 50, 90, 0.06);
    }

    header h2 {
        font-size: 30px;
        color: #5d5066;
        letter-spacing: 0.5px;
    }

    /* NAVIGATION */
    nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
    }

    nav a {
        color: #5d5066;
        text-decoration: none;
        margin-left: 20px;
        font-size: 18px;
        transition: 0.3s ease;
    }

    nav a:hover {
        color: #a4779d;
    }

    /* LOGIN BOX */
    .login-box {
        width: 420px;
        max-width: 90%;
        margin: 70px auto;
        padding: 40px;

        background: rgba(255, 255, 255, 0.72);

        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 22px;

        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);

        box-shadow:
            0 15px 40px rgba(92, 73, 110, 0.12),
            0 3px 10px rgba(92, 73, 110, 0.05);

        text-align: center;
    }

    .login-box h1 {
        font-size: 38px;
        margin-bottom: 30px;
        color: #51465b;
    }

    /* TABLE */
    table {
        width: 100%;
    }

    td {
        padding: 12px;
    }

    label {
        font-size: 18px;
        color: #62576b;
    }

    /* INPUT FIELDS */
    input[type="text"],
    input[type="password"] {
        width: 100%;
        padding: 13px;

        border: 1px solid #e3dce8;
        border-radius: 10px;

        background: rgba(255, 255, 255, 0.85);

        color: #403947;
        font-size: 16px;

        outline: none;

        transition: 0.3s ease;
    }

    input[type="text"]::placeholder,
    input[type="password"]::placeholder {
        color: #aaa1af;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
        border-color: #c5a8c7;

        box-shadow:
            0 0 0 3px rgba(197, 168, 199, 0.15);

        background: white;
    }

    /* SUBMIT BUTTON */
    input[type="submit"] {
        padding: 13px 35px;

        border: none;
        border-radius: 30px;

        background: linear-gradient(
            135deg,
            #b99ac4,
            #d5a6b9
        );

        color: white;

        font-size: 18px;
        font-weight: bold;

        cursor: pointer;

        box-shadow:
            0 6px 15px rgba(170, 130, 165, 0.25);

        transition: 0.3s ease;
    }

    input[type="submit"]:hover {
        background: linear-gradient(
            135deg,
            #aa8ab7,
            #ca91a9
        );

        transform: translateY(-2px);

        box-shadow:
            0 9px 20px rgba(170, 130, 165, 0.32);
    }

    /* MENU LINK */
    .menu-link {
        display: block;
        text-align: center;
        margin-top: 25px;

        color: #78627c;

        text-decoration: none;

        font-size: 18px;

        transition: 0.3s ease;
    }

    .menu-link:hover {
        color: #a4779d;
        text-decoration: underline;
    }

    /* FOOTER */
    footer {
        text-align: center;
        padding: 20px;

        background: rgba(255, 255, 255, 0.55);

        color: #756a7d;

        border-top: 1px solid rgba(120, 100, 140, 0.08);

        margin-top: 50px;

        backdrop-filter: blur(10px);
    }

    /* TABLET */
    @media (max-width: 900px) {

        header {
            flex-direction: column;
            gap: 15px;
            padding: 20px;
        }

        header h2 {
            font-size: 24px;
        }

        nav a {
            font-size: 14px;
            margin-left: 8px;
            line-height: 30px;
        }
    }

    /* MOBILE */
    @media (max-width: 700px) {

        .login-box {
            margin: 40px auto;
            padding: 25px;
        }

        .login-box h1 {
            font-size: 30px;
        }

        td {
            display: block;
            width: 100%;
            padding: 8px;
        }

    }

</style>



</head>


<body>


    <header>

        <h2>Student Hub Portal</h2>

        <nav>

            <a href="index.html">Home</a>

            <a href="login.html">Login</a>

            <a href="dashboard.html">Dashboard</a>

            <a href="profile.html">Profile</a>

            <a href="events.html">Events</a>

            <a href="attendance.html">Attendance</a>

            <a href="result.html">Results</a>

            <a href="faq.html">FAQ</a>

        </nav>

    </header>



    <div class="login-box">

        <h1>StudentHub - Login</h1>


        <!-- Login Form -->

        <form action="login.php" method="POST">


            <table>


                <!-- Username -->

                <tr>

                    <td>

                        <label for="username">

                            Username:

                        </label>

                    </td>


                    <td>

                        <input

                            type="text"

                            id="username"

                            name="username"

                            placeholder="Enter username"

                            autocomplete="username"

                            required

                        >

                    </td>

                </tr>



                <!-- Password -->

                <tr>

                    <td>

                        <label for="password">

                            Password:

                        </label>

                    </td>


                    <td>

                        <input

                            type="password"

                            id="password"

                            name="password"

                            placeholder="Enter password"

                            autocomplete="current-password"

                            required

                        >

                    </td>

                </tr>



                <!-- Login Button -->

                <tr>

                    <td colspan="2">

                        <input

                            type="submit"

                            value="Login"

                        >

                    </td>

                </tr>


            </table>


        </form>



        <a href="menu.html" class="menu-link">

            Go to Menu Page

        </a>


    </div>



    <footer>

        <p>

            © 2026 Student Hub Portal | All Rights Reserved

        </p>

    </footer>


</body>

</html>
